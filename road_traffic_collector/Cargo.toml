[package]
name = "road_traffic_collector"
version = "0.1.0"
edition = "2024"

[dependencies]
clokwerk = { version = "0.4.0", features = ["async"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12.23", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3.1"
chrono = "0.4.42"
chrono-tz = "0.10.4"